<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDo リスト</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">今日を、ひとつずつ。</p>
        <h1>ToDo リスト</h1>
        <p>やることを書き出して、できたらチェック。</p>
      </header>
      <form id="task-form">
        <label for="task-input">新しいタスク</label>
        <div class="input-row">
          <input id="task-input" name="task" type="text" placeholder="例：本を10ページ読む" maxlength="200" required autocomplete="off">
          <button type="submit">追加</button>
        </div>
        <p id="input-error" class="error" role="alert"></p>
      </form>
      <section aria-label="タスク一覧">
        <p id="task-summary" role="status" aria-live="polite">未完了 0 件 / 全 0 件</p>
        <p id="empty-message">まだタスクはありません。最初のタスクを追加しましょう。</p>
        <ul id="task-list"></ul>
      </section>
      <p class="note">タスクはこのページを開いている間だけ保持されます。</p>
    </main>
  </body>
</html>
